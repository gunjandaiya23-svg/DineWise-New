[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dinewise"
version = "0.1.0"
description = "A retrieval-augmented restaurant recommendation assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=4.48",
  "sentence-transformers>=3.3",
  "faiss-cpu>=1.9",
  "pandas>=2.2",
  "pyarrow>=18",
  "pyyaml>=6.0",
  "tqdm>=4.67",
  "accelerate>=1.2",
  "rank-bm25>=0.2.2",
  "huggingface-hub>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
app = ["streamlit>=1.40"]
tuning = [
  "peft>=0.14",
  "trl>=0.13",
  "bitsandbytes>=0.45",
  "datasets>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
